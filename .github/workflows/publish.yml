name: Publish

on:
  push:
    tags: ['*-v*']

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: resolve package from tag
        id: pkg
        run: |
          dir="packages/${GITHUB_REF_NAME%-v*}"
          tag_version="${GITHUB_REF_NAME##*-v}"
          if [ ! -f "$dir/package.json" ]; then
            echo "::error::no package at $dir"
            exit 1
          fi
          version=$(node -p "require('./$dir/package.json').version")
          if [ "$version" != "$tag_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match $dir version $version"
            exit 1
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - run: npm ci

      # Build before publishing: npm validates bin paths before prepublishOnly
      # runs and silently drops a bin whose file does not exist yet.
      - run: npm run lint && npm run typecheck && npm test && npm run build
        working-directory: ${{ steps.pkg.outputs.dir }}

      - run: npm publish --access public
        working-directory: ${{ steps.pkg.outputs.dir }}
